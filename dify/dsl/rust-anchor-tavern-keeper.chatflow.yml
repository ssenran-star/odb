    - data:
        code: |
          import json


          def main(body: str) -> dict:
              ledger = "（仇账为空：这是第一次见面，或者还没有记下恶作剧。不要编造旧账。）"
              hit_count = "0"
              if not isinstance(body, str):
                  try:
                      body = json.dumps(body, ensure_ascii=False)
                  except Exception:
                      body = ""
              try:
                  data = json.loads(body or "{}")
              except Exception:
                  data = {}
              hits = data.get("hits") if isinstance(data, dict) else None
              if not isinstance(hits, list):
                  hits = []
              lines = []
              for hit in hits:
                  if not isinstance(hit, dict):
                      continue
                  memory = hit.get("memory") if isinstance(hit.get("memory"), dict) else {}
                  state = memory.get("state") or ""
                  if state and state != "active":
                      continue
                  text = str(memory.get("text") or "").strip()
                  kind = str(memory.get("kind") or "").strip()
                  if text:
                      lines.append("- [%s] %s" % (kind, text))
              if lines:
                  ledger = "\n".join(lines)
                  hit_count = str(len(lines))
              return {"ledger": ledger, "hit_count": hit_count}
        code_language: python3
        desc: 只把 state=active 的 hit.memory.text 交给模型。响应形状来自 AtomicMemorySearchHit。
        outputs:
          hit_count:
            children: null
            type: string
          ledger:
            children: null
            type: string
        selected: false
        title: 整理仇账
        type: code
        variables:
        - value_selector:
          - '1003'
          - body
          variable: body
      height: 54
      id: '1004'
