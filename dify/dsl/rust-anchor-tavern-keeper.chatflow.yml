    - data:
        code: |
          import json


          def main(body: str) -> dict:
              status = "empty"
              content = "（PreparedContext 为空。只根据仇账检索结果说话，不要编造旧账。）"
              if not isinstance(body, str):
                  try:
                      body = json.dumps(body, ensure_ascii=False)
                  except Exception:
                      body = ""
              try:
                  data = json.loads(body or "{}")
              except Exception:
                  data = {}
              if isinstance(data, dict):
                  status = str(data.get("status") or "empty")
                  raw = data.get("content")
                  if status == "ready" and isinstance(raw, str) and raw.strip():
                      content = raw
              return {"prepared": content, "prepare_status": status}
        code_language: python3
        desc: status=empty 且 content=null 是正常的空结果，不要当成故障。
        outputs:
