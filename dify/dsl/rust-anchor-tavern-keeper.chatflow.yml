    - data:
        code: |
          import json

          ALLOWED_KINDS = ("grudge", "atonement")


          def _clip(text, limit):
              value = " ".join(str(text or "").split())
              if len(value) <= limit:
                  return value
              return value[:limit]


          def _as_bool(value):
              if isinstance(value, bool):
                  return value
              if isinstance(value, (int, float)) and not isinstance(value, bool):
                  return value != 0
              lowered = str(value or "").strip().lower()
              return lowered in ("true", "yes", "1", "y")


          def _loads_object(text):
              raw = (text or "").strip()
              if raw.startswith("```"):
                  lines = raw.splitlines()
                  if lines and lines[0].startswith("```"):
                      lines = lines[1:]
                  if lines and lines[-1].startswith("```"):
                      lines = lines[:-1]
                  raw = "\n".join(lines).strip()
              start = raw.find("{")
              end = raw.rfind("}")
              if start < 0 or end <= start:
                  raise ValueError("no json object")
              data = json.loads(raw[start : end + 1])
              if not isinstance(data, dict):
                  raise ValueError("not an object")
              return data


          def _fit_text(text):
              raw = text.encode("utf-8")
              if len(raw) <= 8000:
                  return text
              return raw[:8000].decode("utf-8", "ignore")


          def main(text: str, scope_id: str) -> dict:
              reply = "（老疤把杯子顿在柜上）你这话我没听清。想喝酒就直说，想捣鬼也直说。"
              should = "no"
              kind = ""
              memory_text = ""
              remember_body = ""
              label = "否"
              try:
                  data = _loads_object(text)
                  candidate = str(data.get("reply") or "").strip()
                  if candidate:
                      reply = candidate
                  summary = _clip(data.get("memory_summary"), 400)
                  for prefix in ("仇账：", "仇账:"):
                      if summary.startswith(prefix):
                          summary = summary[len(prefix) :].strip()
                  kind_raw = str(data.get("memory_kind") or "").strip().lower()
                  if kind_raw not in ALLOWED_KINDS:
                      kind_raw = "atonement" if "赔罪" in summary else "grudge"
                  reason = _clip(data.get("reason") or "玩家在锈锚酒馆留下了一笔仇账", 200)
                  remember = _as_bool(data.get("should_remember")) and bool(summary)
                  if remember:
                      if kind_raw == "atonement":
                          memory_text = (
                              "仇账：玩家在锈锚酒馆向老板老疤赔罪——"
                              + summary
                              + "。之后老疤可以松一档，但仍能提起旧账，不能当成第一次见面。"
                          )
                      else:
                          kind_raw = "grudge"
                          memory_text = (
                              "仇账：玩家在锈锚酒馆对老板老疤恶作剧——"
                              + summary
                              + "。之后老疤必须点名这件事，并因此冷淡、加价或拒绝赊账。"
                          )
                      memory_text = _fit_text(memory_text)
                      payload = {
                          "scope_id": (scope_id or "").strip(),
                          "kind": kind_raw,
                          "text": memory_text,
                          "reason": reason,
                      }
                      remember_body = json.dumps(payload, ensure_ascii=False)
                      should = "yes"
                      kind = kind_raw
                      label = "是"
                  else:
                      kind = ""
                      memory_text = ""
              except Exception:
                  pass
              return {
                  "reply": reply,
                  "should_remember": should,
                  "remember_body": remember_body,
                  "memory_kind": kind,
                  "memory_text": memory_text,
                  "remember_label": label,
              }
        code_language: python3
        desc: 模型只提供摘要。仇账标记、kind 和 JSON 转义由这里完成，避免玩家原话拆坏请求体。请求体只有 scope_id、kind、text、reason。
        outputs:
          memory_kind:
            children: null
            type: string
          memory_text:
            children: null
            type: string
          remember_body:
            children: null
            type: string
          remember_label:
            children: null
            type: string
          reply:
            children: null
            type: string
          should_remember:
            children: null
            type: string
