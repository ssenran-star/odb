    - data:
        code: |
          import json


          def main(scope_id: str) -> dict:
              scope = (scope_id or "").strip()
              search_body = json.dumps(
                  {
                      "scope_id": scope,
                      "query": "仇账",
                      "limit": 10,
                      "mode": "fts",
                  },
                  ensure_ascii=False,
              )
              prepare_body = json.dumps(
                  {
                      "scope_id": scope,
                      "query": "仇账",
                      "max_bytes": 4000,
                  },
                  ensure_ascii=False,
              )
              return {"search_body": search_body, "prepare_body": prepare_body}
